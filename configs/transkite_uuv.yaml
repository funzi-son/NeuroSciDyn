# TransKITE configuration for UUV (3DMoTraj) dataset
data_dir: data/3DMoTraj
scenes: [3Dscene1, 3Dscene2, 3Dscene3, 3Dscene4, 3Dscene5, 3Dscene6, 3Dscene7, 3Dscene8]
save_dir: checkpoints/transkite/uuv

seq_len: 8
pred_len: 12
stride: 2
fps: 10.0
dt: 0.1

input_dim: 3
hidden_dim: 64
num_layers: 2
nhead: 4
dropout: 0.2
use_kinematics: true
use_sg_filter: true

batch_size: 64
epochs: 300
lr: 0.001
weight_decay: 0.0001
patience: 30
seed: 42

alpha_vel: 0.1
alpha_cons: 0.1
alpha_phys: 0.1
error_threshold: 2.0
